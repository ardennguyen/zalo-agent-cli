name: CI

# Every branch and every pull request, whatever its base: a version branch such as v2.5-dev gets the
# Linux run on each push, not only when a PR is opened.
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # The same npm the publish workflow uses, so the lockfile is checked the way it will be installed.
      # npm ^12.2.0 needs Node ^22.22.2 or newer; `22` resolves to the latest 22.x.
      - run: npm install -g npm@^12.2.0

      - run: npm ci
      # The SQLite driver ships prebuilt binaries and runs no install script: prove the Linux one loads, opens an
      # encrypted database and has the trigram index the search uses, before anything else depends on it.
      - name: SQLite driver prebuild smoke (linux-x64)
        run: |
          node -e '
            const D = require("better-sqlite3-multiple-ciphers");
            const f = require("path").join(require("fs").mkdtempSync(require("path").join(require("os").tmpdir(), "smoke-")), "smoke.db");
            const db = new D(f);
            db.pragma("cipher = \"sqlcipher\""); db.pragma("legacy = 4"); db.key(Buffer.from("ci-smoke-passphrase"));
            db.exec("CREATE VIRTUAL TABLE f USING fts5(t, tokenize=\"trigram\")");
            db.prepare("INSERT INTO f VALUES (?)").run("xin chao");
            if (db.prepare("SELECT count(*) AS c FROM f WHERE f MATCH ?").get("chao").c !== 1) process.exit(1);
            db.close();
            if (require("fs").readFileSync(f).subarray(0, 15).toString() === "SQLite format 3") process.exit(1);
            console.log("sqlite driver ok");
          '
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: node src/index.js --version
      - run: node src/index.js --help

      # The live E2E suite never runs in CI — it needs a real Zalo session and
      # writes to real conversations. Importing the tier files without
      # ZALO_TEST_LIVE=1 is inert (every suite skips), so this is purely a
      # syntax/import check: it catches a broken tier file at PR time instead
      # of when someone next runs the live suite by hand.
      - name: E2E tier files import cleanly (no live session, no writes)
        run: node --test tests/e2e/*.test.js
