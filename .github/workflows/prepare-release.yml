name: Prepare release PR
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (engine: 3.0.0; wrapper: 2.1.0)'
        required: true
        type: string
      branch:
        description: 'Version branch to prepare from (default: the active one — engine v3.0-dev, wrapper v2.0-dev)'
        required: false
        type: string
      engine_range:
        description: 'Wrapper only: the engine range it depends on (default: ^N.0.0 for the newest published engine major, e.g. ^3.0.0)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      VERSION: ${{ inputs.version }}
      BRANCH_INPUT: ${{ inputs.branch }}
      ENGINE_RANGE_INPUT: ${{ inputs.engine_range }}
    steps:
      - name: Select trusted upstream branch and validate version
        id: target
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use X.Y.Z'; exit 1; }
          case "$GITHUB_REPOSITORY" in
            ardennguyen/zalo-agent-cli) target='v3.0-dev'; package='@ardennguyen/zalo-agent-cli' ;;
            ardennguyen/zalo-mcp) target='v2.0-dev'; package='@ardennguyen/zalo-mcp' ;;
            *) echo 'Run only in the trusted upstream repository'; exit 1 ;;
          esac
          # The active version branch moves with every major/minor line (docs/RELEASE.md); an explicit input wins.
          if [[ -n "${BRANCH_INPUT:-}" ]]; then target="$BRANCH_INPUT"; fi
          echo "branch=$target" >> "$GITHUB_OUTPUT"
          echo "package=$package" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^12.2.0

      - name: Validate source package and published engine prerequisite
        env:
          EXPECTED_PACKAGE: ${{ steps.target.outputs.package }}
        run: |
          set -euo pipefail
          node -e 'if(require("./package.json").name!==process.env.EXPECTED_PACKAGE) process.exit(1);'
          npm view "$EXPECTED_PACKAGE" versions --json > "$RUNNER_TEMP/published-versions.json"
          node -e 'const fs=require("fs"),v=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/published-versions.json","utf8")); if([].concat(v).includes(process.env.VERSION)) throw new Error("Version already published; choose a new release version");'
          if [[ "$EXPECTED_PACKAGE" == '@ardennguyen/zalo-mcp' ]]; then
            # The wrapper follows the engine's newest major (^3.0.0 once 3.0.0 is out), never a hard-coded line.
            # Read off the published versions, not the `latest` tag: a 2.5.x patch published after 3.0.0 moves it.
            engine_range="${ENGINE_RANGE_INPUT:-}"
            if [[ -z "$engine_range" ]]; then
              npm view '@ardennguyen/zalo-agent-cli' versions --json > "$RUNNER_TEMP/engine-versions.json"
              major=$(node -e 'const v=[].concat(JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP+"/engine-versions.json","utf8"))).filter(x=>/^\d+\.\d+\.\d+$/.test(x)); if(!v.length) process.exit(1); console.log(Math.max(...v.map(x=>Number(x.split(".")[0]))));')
              engine_range="^${major}.0.0"
            fi
            [[ "$engine_range" =~ ^\^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "engine_range must look like ^3.0.0"; exit 1; }
            echo "Engine range: $engine_range"
            npm view "@ardennguyen/zalo-agent-cli@${engine_range}" version --json
            npm pkg set "dependencies.@ardennguyen/zalo-agent-cli=${engine_range}"
          fi

      - name: Synchronize package version and real registry lockfile
        run: |
          set -euo pipefail
          npm version "$VERSION" --no-git-tag-version --ignore-scripts --allow-same-version
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e 'const p=require("./package.json"),l=require("./package-lock.json"); if(p.version!==process.env.VERSION || l.version!==p.version || l.packages[""].version!==p.version) throw new Error("Version/lock mismatch");'
          npm ci

      - name: Validate candidate without a Zalo account
        env:
          EXPECTED_PACKAGE: ${{ steps.target.outputs.package }}
        run: |
          set -euo pipefail
          if [[ "$EXPECTED_PACKAGE" == '@ardennguyen/zalo-agent-cli' ]]; then
            npm run format
            npm run lint
            npm run format:check
            npm test
            node src/index.js --version
            node src/index.js mcp start --help | grep -- '--account'
            git diff --exit-code -- src tests
          else
            npm run test --if-present
            node node_modules/@ardennguyen/zalo-agent-cli/src/index.js --version
            node node_modules/@ardennguyen/zalo-agent-cli/src/index.js mcp start --help | grep -- '--account'
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-manifests
          path: |
            package.json
            package-lock.json

      - name: Commit manifests to a new branch and open a reviewable PR
        env:
          # The release commit is authored by whoever ran this workflow, not by github-actions[bot].
          # A pull request opened with the default GITHUB_TOKEN is always attributed to github-actions[bot];
          # to open it as yourself, add a personal access token (repo scope) as the RELEASE_PAT secret.
          GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -euo pipefail
          branch="chore/release-$VERSION"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo 'Release branch already exists; review its PR rather than overwriting it.'
            exit 1
          fi
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'No manifest changes; no commit or PR needed.'
            exit 0
          fi
          git switch -c "$branch"
          git config user.name "$ACTOR"
          git config user.email "${ACTOR_ID}+${ACTOR}@users.noreply.github.com"
          gh auth setup-git
          git commit -m "chore: prepare release v$VERSION"
          git push --set-upstream origin "$branch"
          printf '%s\n' 'Synchronizes package.json and package-lock.json using published npm metadata.' '' 'Candidate installation and available offline checks passed in the preparation run. If the wrapper base has no test script yet, its launcher tests were not run: merge the feature PR and require final CI before tagging. Review resolved versions and approve bot PR workflows if GitHub requests it. This PR creates no release and runs no npm publish.' > "$RUNNER_TEMP/release-pr.md"
          gh pr create --base "$TARGET_BRANCH" --head "$branch" --title "chore: prepare release v$VERSION" --body-file "$RUNNER_TEMP/release-pr.md"
