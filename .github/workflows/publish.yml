name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required for npm provenance

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      # npm trusted publishing (OIDC) needs npm >= 11.5.1. npm ^12.2.0 is the current line (it needs
      # Node ^22.22.2, ^24.15.0 or >=26). The release is built and tested on Node 26, the LTS line we
      # run; ci.yml also runs the suite on Node 22, the floor `engines` asks for (>=22.19.0).
      - run: npm install -g npm@^12.2.0

      - run: npm ci
      - run: npm run lint
      - run: npm test

      # The published package ships the compiled runtime under dist/ (package.json `files`), not src/. Build it
      # here so a failure stops the release; `prepack` also runs it on `npm publish`, so the two agree.
      - run: npm run build

      # No token: this workflow is the package's trusted publisher on npmjs.com
      # (repository ardennguyen/zalo-agent-cli, workflow publish.yml, "Allow npm
      # publish"). npm exchanges the job's OIDC identity (id-token: write above)
      # for a short-lived publish credential, so there is no secret to expire.
      - name: Publish @ardennguyen/zalo-agent-cli
        run: npm publish --access public --provenance
