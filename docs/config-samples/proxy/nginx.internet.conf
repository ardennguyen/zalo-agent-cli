# nginx: one account's MCP server on the internet, TLS terminated by nginx.
# The engine stays on 127.0.0.1:3847.
server {
    listen 443 ssl http2;
    server_name zalo.example.com;

    ssl_certificate     /etc/letsencrypt/live/zalo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zalo.example.com/privkey.pem;

    # Optional: only these addresses may connect.
    # allow 203.0.113.0/24;
    # deny  all;

    # The QR login page of `zalo-agent login --public-url https://zalo.example.com`
    # (or ZALO_MCP_PUBLIC_URL / publicUrl): the login prints
    # https://zalo.example.com/zalo/qr/<one-time token> and serves it on its QR port
    # (18927 unless --qr-port), which answers only while the login runs.
    location /zalo/qr/ {
        proxy_pass http://127.0.0.1:18927;
        proxy_http_version 1.1;
        proxy_buffering off;
    }

    # Everything else, the one-time secure page /zalo/secure/<token> included, goes
    # to the MCP server. Its links are built from publicUrl
    # (ZALO_MCP_PUBLIC_URL=https://zalo.example.com), never from the Host header.
    location / {
        proxy_pass http://127.0.0.1:3847;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # MCP replies are streamed and /events/wait holds the request for up to 300 s.
        proxy_buffering off;
        proxy_read_timeout 310s;
        proxy_send_timeout 310s;
    }
}
