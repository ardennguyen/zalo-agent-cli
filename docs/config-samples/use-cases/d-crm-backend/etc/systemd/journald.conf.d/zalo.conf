# /etc/systemd/journald.conf.d/zalo.conf
# The daemons log to the journal (ZALO_LOG_LEVEL=info in common.env: never debug, which
# holds message text). Cap the journal and keep a month of it.
#   sudo install -D -m 644 zalo.conf /etc/systemd/journald.conf.d/zalo.conf
#   sudo systemctl restart systemd-journald
[Journal]
Storage=persistent
SystemMaxUse=500M
MaxRetentionSec=1month
